services:
  front:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./front/index.html:/usr/share/nginx/html/index.html:ro
      - ./front/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOTE: db
      DB_PORT: "5432"
      DB_NOM: stockline
      DB_UTILISATEUR: stockline
      DB_MOT_DE_PASSE: ${DB_MOT_DE_PASSE}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockline
      POSTGRES_USER: stockline
      POSTGRES_PASSWORD: ${DB_MOT_DE_PASSE}
    volumes:
      - donnees-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockline -d stockline"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  donnees-db:
